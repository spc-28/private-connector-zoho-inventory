[project]
name = "zoho-inventory-connector"
version = "0.1.0"
description = "Read-only MCP connector exposing Zoho Inventory data to Razorpay Agent Studio agents"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "mcp>=2.2,<3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
evals = ["anthropic[mcp]"]
dev = ["ruff"]

[project.scripts]
zoho-connector = "zoho_connector.server:main"
zoho-connector-setup = "zoho_connector.auth.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoho_connector"]

[tool.ruff]
line-length = 100
